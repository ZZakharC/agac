<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AGAC</title>
</head>

<body>
    <header>
        <img src="/icon.png" tabindex="0">
        <h1>AGAC</h1>
    </header>

    <main class="layout">
        <section class="left">
            <div class="stage">
                <div id="evalbar" aria-hidden="true">
                    <div id="evalfill"></div>
                </div>
                <div id="board" aria-label="Шахматная доска"></div>
            </div>

            <div class="controls">
                <button id="first" title="В начало (Home)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M11,18L5,12l6-6l1.4,1.4L7.83,12l4.58,4.6L11,18Zm6.6,0l-6-6l6-6L19,7.4L14.43,12L19,16.6L17.6,18Z"/></svg>
                </button>
                <button id="prev" title="Назад (←)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M14,18L8,12l6-6l1.4,1.4L10.8,12l4.6,4.6L14,18Z"/></svg>
                </button>
                <button id="next" title="Вперёд (→)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M12.6,12L8,7.4L9.4,6l6,6l-6,6L8,16.6L12.6,12Z"/></svg>
                </button>
                <button id="last" title="В конец (End)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M9.58,12L5,7.4L6.4,6l6,6l-6,6L5,16.6L9.58,12Zm6.6,0L11.6,7.4L13,6l6,6l-6,6l-1.4-1.4L16.18,12Z"/></svg>
                </button>
                <button id="flip" title="Перевернуть (F)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M8,13V5.82L5.43,8.4L4,7L9,2l5,5L12.58,8.4L10,5.82V13H8Zm7,9l-5-5l1.43-1.4L14,18.18V11h2v7.18l2.57-2.58L20,17l-5,5Z"/></svg>
                </button>
                <output id="evaltext">-</output>
            </div>
            <div id="graph" title="Нажмите, чтобы перейти к ходу"></div>
        </section>

        <aside class="right">
            <div class="panel">
                <textarea id="pgn" rows="6" spellcheck="false" placeholder="Вставьте PGN партии"></textarea>

                <label class="server">Движок
                    <select id="mode">
                        <option value="local">На устройстве</option>
                        <option value="server">Сервер</option>
                    </select>
                </label>
                <label class="server" id="server-field">Адрес сервера
                    <input id="server" placeholder="192.168.1.10:3000" inputmode="url" autocapitalize="off" spellcheck="false" />
                </label>

                <div class="row">
                    <label>Глубина
                        <select id="depth">
                            <option value="12">12 - быстро</option>
                            <option value="16" selected>16 - обычно</option>
                            <option value="20">20 - глубоко</option>
                            <option value="24">24 - экстремально</option>
                        </select>
                    </label>
                    <button id="analyze" class="primary">Анализировать</button>
                </div>
                <progress id="progress" value="0" max="1" hidden></progress>
                <p id="status" role="status"></p>
            </div>
            
            <div class="panel" id="info"></div>
            <div class="panel" id="summary" hidden></div>
            <div class="panel">
                <div id="moves"></div>
            </div>

            <div class="panel" id="io">
                <strong>Сохраняйте и загружайте анализы партий</strong>
                <div>
                    <button id="import" class="ghost">Импорт</button>
                    <button id="export" class="ghost" disabled>Экспорт</button>
                    <input id="import-file" type="file" accept=".json,application/json" hidden />
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
